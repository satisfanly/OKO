# Yocto selects only first oko.conf from layer. So it is not merged among layers.
# For now DISTRO not supposed to be changed. Because it is only one supported config.
# It is more like sanity of this config or versioning
DISTRO = "oko"
# Control MACHINE , etc via connected layers. For now it overrided by corresponding bsp layer.

# Keep downloads and shared state outside the build environment.
DL_DIR ?= "${TOPDIR}/../../downloads"
SSTATE_DIR ?= "${TOPDIR}/../../sstate-cache"

# Uncomment and customize after publishing the deploy/deb tree.
# PACKAGE_FEED_URIS = "https://packages.example.invalid/oko"
# PACKAGE_FEED_BASE_PATHS = "deb"
# PACKAGE_FEED_ARCHS = "all core2-64 genericx86-64"
MACHINE_EXTRA_RRECOMMENDS:remove = "linux-firmware"

CONF_VERSION = "2"
