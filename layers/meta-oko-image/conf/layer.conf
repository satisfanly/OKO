BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "oko-image"
BBFILE_PATTERN_oko-image = "^${LAYERDIR}/"
BBFILE_PRIORITY_oko-image = "20"

# This depends on oko-ai, because oko-image includes all infrastructure for images, like installer and installer must be aware about tools installed in that image
LAYERDEPENDS_oko-image = "core openembedded-layer meta-python networking-layer oko-base oko-ai"
LAYERSERIES_COMPAT_oko-image = "wrynose"
