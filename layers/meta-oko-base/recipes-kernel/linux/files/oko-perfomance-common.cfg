# This file holds common for all cpus optimizations

# Compiler / CPU
CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE=y
CONFIG_CC_OPTIMIZE_FOR_SIZE=n
CONFIG_READABLE_ASM=n
CONFIG_FRAME_POINTER=n
CONFIG_FUNCTION_TRACER=n

# We have no local attack vectors. Whole system built by Yocto
CONFIG_CPU_MITIGATIONS=n

# Scheduler - throughput biased
CONFIG_PREEMPT_NONE=y
CONFIG_HZ_100=y
CONFIG_HZ=100
CONFIG_NO_HZ_IDLE=y

