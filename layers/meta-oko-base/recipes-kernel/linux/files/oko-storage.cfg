# OKO storage configuration

#
# Block layer
#
CONFIG_BLOCK=y
CONFIG_BLK_DEV_BSG=y

#
# NVMe
#
CONFIG_NVME_CORE=y
CONFIG_BLK_DEV_NVME=y

#
# SCSI disk support
#
CONFIG_SCSI=y
CONFIG_BLK_DEV_SD=y

#
# Partition tables
#
CONFIG_PARTITION_ADVANCED=y
CONFIG_EFI_PARTITION=y

#
# Filesystems
#
CONFIG_EXT4_FS=y

CONFIG_FAT_FS=y
CONFIG_VFAT_FS=y
CONFIG_FAT_DEFAULT_UTF8=y
