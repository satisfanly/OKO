BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "oko-base"
BBFILE_PATTERN_oko-base = "^${LAYERDIR}/"
BBFILE_PRIORITY_oko-base = "20"

LAYERDEPENDS_oko-base = "core openembedded-layer meta-python networking-layer"
LAYERSERIES_COMPAT_oko-base = "wrynose"
