# Poky 6.0 still defaults to SysVinit. Select systemd before loading Poky's
# distro policy so its init-manager defaults are derived consistently.
POKY_INIT_MANAGER = "systemd"
require conf/distro/poky.conf
DISTRO = "oko"

DISTRO_NAME = "OKO Server"
DISTRO_VERSION = "0.1"
DISTRO_CODENAME = "wrynose"
SDK_VENDOR = "-oko"
SDK_VERSION = "${DISTRO_VERSION}"

# Produce Debian-format packages and retain APT/dpkg in target images. This is
# a Yocto distribution, not a Debian binary-compatible userspace.
PACKAGE_CLASSES = "package_deb"

# systemd-only and intentionally headless.
INIT_MANAGER = "systemd"
VIRTUAL-RUNTIME_init_manager = "systemd"
DISTRO_FEATURES:append = " systemd pam usrmerge"
# Native vulkan feature enabled to support mesa-tools-native 
DISTRO_FEATURES_FILTER_NATIVE:append = " vulkan"
DISTRO_FEATURES:remove = "sysvinit x11 wayland opengl pulseaudio pipewire bluetooth"

# systemd-networkd/resolved are configured by the installer.
PACKAGECONFIG:append:pn-systemd = " networkd resolved"
# Add wg and wg-quick tools
# Actually better to put this to bbappend in base-oko layer
PACKAGECONFIG:append:pn-wireguard-tools = " wg-quick"

# Locale
ENABLE_BINARY_LOCALE_GENERATION = "1"
IMAGE_INSTALL:append = " locale-base-en-us"
LOCALE_UTF8_IS_DEFAULT = "1"
IMAGE_LINGUAS = "en-us"

PREFERRED_PROVIDER_virtual/kernel = "linux-yocto-dev"

# Disable SPDX/SBOM generation
INHERIT_DISTRO:remove = "create-spdx"

# TODO: use this common optimizations + kernel common optmimization in separate layer common-perfomance
# Enable link-time-optimizations if it possible and other common optimisations
# Note that according to Yocto's doc to enable lto u need to also include additional lto.inc
require conf/distro/include/lto.inc
DISTRO_FEATURES:append = " lto"
# Explicitly disable debug build
DEBUG_BUILD = "0"
# By default yocto has O2
FULL_OPTIMIZATION = "-O3"
# This layer expects that we also will have bsp with tune, that may be unable to proceed with qemu (znver5 aggressive optimizations for example)
# So thsi is part of recipes-cross-fix:
# Target code uses instructions that qemu-user/TCG cannot fully emulate.
# Prevent configure systems from trying to execute target binaries via QEMU.
MACHINE_FEATURES_OPTED_OUT += " qemu-usermode"
# OKO targets physical hardware only.
# For example genericx86-64 enables qemuboot for runqemu support, which pulls in
# qemu-system-native during image builds. We don't use runqemu.
IMAGE_CLASSES:remove = "qemuboot"
