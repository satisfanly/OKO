# GPU
# -----------------------------------------------------
DISTRO_FEATURES:append = " vulkan"
PACKAGECONFIG:append:pn-mesa = " amd gallium-llvm"
MACHINE_EXTRA_RDEPENDS:append = " linux-firmware-amdgpu"
# Utils
MACHINE_EXTRA_RDEPENDS:append = " amd-smi"
# Overclocking
MACHINE_EXTRA_RDEPENDS:append = " ryzenadj ec-su-axb35 oko-smu-control"

# AMD Zen 5 CPU tune
# -----------------------------------------------------
# Machine works similarly to DISTRO:
# MACHINE selects conf/machine/<machine>.conf.
MACHINE = "genericx86-64"

# genericx86-64 supports legacy BIOS and UEFI boot.
EFI_PROVIDER = "grub-efi"

# genericx86-64 already includes the complete x86 tune hierarchy:
#
#   genericx86-64.conf
#     -> tune-x86-64-v3.inc
#       -> tune-corei7.inc
#         -> ...
#           -> arch-x86.inc
#
# Do NOT require arch-x86.inc or another existing x86 tune here again,
# otherwise its ".=" assignments are evaluated twice and can produce
# invalid values such as TUNE_ARCH="x86_64x86_64".

# Register our additional tune feature.
TUNEVALID[znver5] = "AMD Zen 5 specific processor optimizations"

# Translate the "znver5" tune feature into GCC target options.
#
# m64 -> -m64 is already handled by arch-x86.inc.
TUNE_CCARGS .= "${@bb.utils.contains('TUNE_FEATURES', 'znver5', \
    ' -march=znver5 -mtune=znver5', '', d)}"

# Register the complete tune.
AVAILTUNES += "znver5-64"

# Start from the standard 64-bit x86 ABI ("m64") and add Zen 5.
#
# Expands to:
#   TUNE_FEATURES = "m64 znver5"
TUNE_FEATURES:tune-znver5-64 = \
    "${TUNE_FEATURES:tune-x86-64} znver5"

# Standard x86_64 library ABI.
BASE_LIB:tune-znver5-64 = "lib64"

# Packages built specifically with this tune use their own architecture.
TUNE_PKGARCH:tune-znver5-64 = "znver5-64"

# Zen 5 is backwards-compatible with the package architectures already
# supported by genericx86-64/x86-64-v3. Keep those architectures usable,
# then add our new optimized architecture as the most specific one.
PACKAGE_EXTRA_ARCHS:tune-znver5-64 = \
    "${PACKAGE_EXTRA_ARCHS:tune-x86-64-v3} znver5-64"

# Select our tune instead of genericx86-64's default core2-64 tune.
DEFAULTTUNE = "znver5-64"

