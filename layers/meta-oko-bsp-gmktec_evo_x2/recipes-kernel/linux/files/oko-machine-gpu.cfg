# DRM enablement needed for vulkan
CONFIG_DRM=y

# Keep AMDGPU as a module instead of building it into the kernel.
#
# This system does not use an initramfs. AMD GPU firmware is stored only on
# the real root filesystem under /lib/firmware/amdgpu/.
#
# A built-in AMDGPU driver (CONFIG_DRM_AMDGPU=y) may probe the GPU during
# early kernel initialization, before the real root= filesystem has been
# mounted and pivoted into. At that point the kernel is still using its
# initial in-memory rootfs, which does not contain /lib/firmware.
#
# As a result, request_firmware() fails with -ENOENT for required blobs such
# as psp_14_0_1_toc.bin, gc_11_5_1_pfp.bin, sdma_6_1_1.bin, etc., causing
# AMDGPU initialization to fail.
#
# Building AMDGPU as a module defers probing until after the real root
# filesystem is available, allowing firmware to be loaded normally from
# /lib/firmware/amdgpu/.
CONFIG_DRM_AMDGPU=m

CONFIG_HSA_AMD=y
# Note that ROCm stack also need CONFIG_HSA_AMD_SVM=y . But we not using it so keep disabled .
